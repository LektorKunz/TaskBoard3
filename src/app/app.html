<header>
  <h1>TaskBoard</h1>
</header>

<nav class="filters">
  <button [class.active]="filter() === 'ALL'"  (click)="setFilter('ALL')">Alle</button>
  <button [class.active]="filter() === 'OPEN'" (click)="setFilter('OPEN')">Åbne</button>
  <button [class.active]="filter() === 'DONE'" (click)="setFilter('DONE')">Færdige</button>
</nav>

<main class="board">
  @for (t of visibleTasks(); track t.id) {
    <app-task-card
      [task]="t"
      (toggled)="onTaskToggled($event)"
      (deleted)="onTaskDeleted($event)"/>
  } @empty {
    <p class="empty">Ingen opgaver matcher filtret.</p>
  }
</main>

<footer>
  <p>{{ openCount() }} åbne af {{ tasks().length }} opgaver</p>
</footer>
